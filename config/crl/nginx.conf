# Serves the CRL at the exact URI baked into every device cert's CDP extension:
# http://crl:8080/root.crl. The service name, this port, and DEFAULT_CDP in
# scripts/make_certs.py must all agree, or the broker holds no CRL and rejects
# every certificate.
server {
  listen 8080;
  listen [::]:8080;
  root /usr/share/nginx/html;
  default_type application/pkix-crl;
  location / { autoindex on; }
}
