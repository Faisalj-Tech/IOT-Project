# Phase 5 S6 only. NOT part of the normal ingestion path -- this input exists to
# demonstrate what a static-token consumer does when its token expires.
#
# Telegraf's amqp_consumer takes a static password with no refresh path. The
# token is injected as an environment variable by the test that runs this.

# Minimal output required by Telegraf; this S6 test only cares about input failure.
[[outputs.file]]
  files = ["/dev/null"]

[[inputs.amqp_consumer]]
  brokers = ["amqp://rabbitmq:5672/eu"]
  username = ""
  password = "${IOT_OAUTH_TOKEN}"
  exchange = "amq.topic"
  exchange_type = "topic"
  exchange_passive = true
  queue = "telemetry.eu.q"
  queue_durability = "durable"
  queue_passive = true
  prefetch_count = 50
  max_undelivered_messages = 1000
  data_format = "json_v2"

  [inputs.amqp_consumer.tags]
    region_src = "eu"

  [[inputs.amqp_consumer.json_v2]]
    measurement_name = "telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.000Z07:00"
    timestamp_timezone = "UTC"

    [[inputs.amqp_consumer.json_v2.field]]
      path = "value"
      type = "float"
