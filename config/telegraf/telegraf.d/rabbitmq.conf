# Broker health scraped from the management API. The telegraf user carries the
# `monitoring` tag, which is what grants access to these endpoints.
[[inputs.rabbitmq]]
  url = "http://rabbitmq:15672"
  username = "${RABBITMQ_TELEGRAF_USER}"
  password = "${RABBITMQ_TELEGRAF_PASSWORD}"
  queue_name_include = ["telemetry.q", "dlq", "telemetry.eu.q", "telemetry.us.q"]

