# Phase 6: two clocks in one row, so end-to-end latency is a subtraction.
#
# telegraf.conf sets timestamp_path = "ts", which makes the InfluxDB row timestamp
# the DEVICE's publish time - so a baseline row knows when a message was produced
# and nothing about when it was ingested.
#
# This overlay adds a second input that does NOT set timestamp_path, so its point
# timestamp is Telegraf's own ingest time, and emits `ts` as a string FIELD
# instead. One row therefore carries both clocks.
#
# It deliberately does not REPLACE the base input's timestamp handling: doing that
# would change what _time means in the load profile only, so load rows and
# baseline rows could never share a Grafana panel (spec 4.4).
#
# Both clocks come from containers on one host, so this measures pipeline latency,
# not clock skew between machines.

[[inputs.amqp_consumer]]
  brokers = ["amqp://rabbitmq:5672/"]
  username = "${RABBITMQ_TELEGRAF_USER}"
  password = "${RABBITMQ_TELEGRAF_PASSWORD}"
  exchange = "amq.topic"
  exchange_type = "topic"
  exchange_passive = true
  queue = "telemetry.q"
  queue_durability = "durable"
  queue_passive = true
  binding_key = "region.#"
  prefetch_count = 50
  max_undelivered_messages = 1000
  data_format = "json_v2"

  [[inputs.amqp_consumer.json_v2]]
    measurement_name = "telemetry"

    [[inputs.amqp_consumer.json_v2.tag]]
      path = "device"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "run_id"

    [[inputs.amqp_consumer.json_v2.field]]
      path = "ts"
      type = "string"
    [[inputs.amqp_consumer.json_v2.field]]
      path = "seq"
      type = "int"
