[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1ms"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

[[outputs.health]]
  service_address = "http://:8080"

# Telemetry: consume the durable quorum queue declared in definitions.json.
# queue_passive and the absence of a `configure` permission for this user mean
# Telegraf can never redeclare the queue with different arguments.
[[inputs.amqp_consumer]]
  brokers = ["amqp://rabbitmq:5672/"]
  username = "${RABBITMQ_TELEGRAF_USER}"
  password = "${RABBITMQ_TELEGRAF_PASSWORD}"
  exchange = "amq.topic"
  exchange_type = "topic"
  exchange_passive = true
  queue = "telemetry.q"
  queue_durability = "durable"
  queue_passive = true
  binding_key = "region.#"
  prefetch_count = 50
  max_undelivered_messages = 1000
  data_format = "json_v2"

  [[inputs.amqp_consumer.json_v2]]
    measurement_name = "telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.000Z07:00"
    timestamp_timezone = "UTC"

    [[inputs.amqp_consumer.json_v2.tag]]
      path = "region"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "plant"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "device"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "metric"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "unit"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "run_id"

    [[inputs.amqp_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.amqp_consumer.json_v2.field]]
      path = "seq"
      type = "int"
