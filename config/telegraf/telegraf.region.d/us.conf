# Phase 4: one amqp_consumer per region vhost.
#
# The amq.topic -> telemetry.us.q binding is declared in definitions.region.json.
# We do not set a binding key here; setting it would make Telegraf issue a
# queue.bind, which requires `write` on the queue, which would cost telegraf-us
# its read-only permissions. Measured: with a binding key set and write "^$",
# Telegraf dies at startup with
#   failed to bind a queue: Exception (403) Reason: "ACCESS_REFUSED - write
#   access to queue 'telemetry.us.q' in vhost 'us' refused for user 'telegraf-us'"
[[inputs.amqp_consumer]]
  brokers = ["amqp://rabbitmq:5672/us"]
  username = "telegraf-us"
  password = "${RABBITMQ_TELEGRAF_US_PASSWORD}"
  exchange = "amq.topic"
  exchange_type = "topic"
  exchange_passive = true
  queue = "telemetry.us.q"
  queue_durability = "durable"
  queue_passive = true
  prefetch_count = 50
  max_undelivered_messages = 1000
  data_format = "json_v2"

  # Stamped by the input, not read from the payload. The payload's own `region`
  # tag is whatever the device claimed; this one records the vhost the message
  # was actually consumed from, and it is what the isolation tests assert on.
  [inputs.amqp_consumer.tags]
    region_src = "us"

  [[inputs.amqp_consumer.json_v2]]
    measurement_name = "telemetry"
    timestamp_path = "ts"
    timestamp_format = "2006-01-02T15:04:05.000Z07:00"
    timestamp_timezone = "UTC"

    [[inputs.amqp_consumer.json_v2.tag]]
      path = "region"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "plant"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "device"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "metric"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "unit"
    [[inputs.amqp_consumer.json_v2.tag]]
      path = "run_id"

    [[inputs.amqp_consumer.json_v2.field]]
      path = "value"
      type = "float"
    [[inputs.amqp_consumer.json_v2.field]]
      path = "seq"
      type = "int"
