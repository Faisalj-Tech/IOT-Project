# Phase 5 OAuth2 service identity.
#
# `internal` is FIRST deliberately. Certificate login resolves through the
# internal backend (the CN must name a real user), and every Phase 1-4
# plain-credential path depends on it. Measured: with this ordering,
# authenticate_user still succeeds for device, device-eu and admin (spec 2.16).
auth_backends.1 = internal
auth_backends.2 = rabbit_auth_backend_oauth2

auth_oauth2.resource_server_id = rabbitmq

# Must be https. RabbitMQ 4.x refuses to boot on a plaintext issuer with
# "According to the JWT Specification, Key Server URL must be https" (spec 2.10).
auth_oauth2.issuer = https://keycloak:8443/realms/iot
auth_oauth2.https.cacertfile = /certs/rootCA.crt
auth_oauth2.https.verify = verify_peer

# Keycloak's own `scope` claim is managed by its client-scope machinery, so the
# RabbitMQ permission scopes ride in a claim of their own.
auth_oauth2.additional_scopes_key = rmq_scopes

# Without this the identity in logs and the management UI is the service
# account's bare `sub` UUID (spec 2.11). NOT verified during design -- if the
# broker rejects this key, remove it and record the UUID identity as a known
# limit rather than inventing a workaround.
auth_oauth2.preferred_username_claims.1 = preferred_username
