# Phase 5. Merged with rabbitmq.conf rather than replacing it: RabbitMQ reads
# /etc/rabbitmq/conf.d/*.conf in addition to the main file, which is why this
# overlay never has to fight compose.region.yml for a mount target (spec 2.13).
#
# 8883 binds all interfaces and is published, so it is the TLS counterpart of the
# plaintext 1883 fallback. The region listeners take 9883/9993 in
# 15-region-security.conf; they cannot share 8883, because an all-interfaces bind
# collides with a specific-address bind on the same port.
mqtt.listeners.ssl.default = 8883

# The client cert's CN becomes the RabbitMQ username. Measured on 4.3.4: this is
# an MQTT-specific switch, separate from AMQP's rabbitmq_auth_mechanism_ssl, and
# the internal backend still resolves the user, so a CN naming no user is refused
# (spec 2.1, 2.2).
mqtt.ssl_cert_login = true
ssl_cert_login_from = common_name
