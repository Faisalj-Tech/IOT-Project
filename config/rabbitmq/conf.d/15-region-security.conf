# Phase 5, region profile only. Mounted by compose.region-security.yml, which
# compose_files() appends solely when IOT_REGION=1 and IOT_SECURITY=1 are both set.
#
# These cannot live in 10-security.conf: under base+security the addresses below
# do not exist and the listeners fail to bind. They cannot live in
# compose.region.yml either: under region-alone there is no advanced.config, so a
# TLS listener would have no ssl_options and the node would not boot.
#
# 9883/9993 rather than 8883: 10-security.conf binds 8883 on all interfaces, and
# an all-interfaces bind collides with a specific-address bind on the same port.
# The tiering mirrors Phase 4's plaintext 1883 / 1893 / 1993 exactly.
mqtt.listeners.ssl.eu = 172.28.1.10:9883
mqtt.listeners.ssl.us = 172.28.2.10:9993
