# Phase 6: pinned broker memory high watermark.
# Modern RabbitMQ 4.x configuration approach (not the deprecated environment variable).
# 256 MiB out of 1 GiB = 0.25 (25% watermark).
# Set total memory available to 1 GiB, then set watermark to 25% of that.
total_memory_available_override_value = 1073741824
vm_memory_high_watermark.relative = 0.25
