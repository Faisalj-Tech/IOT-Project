listeners.tcp.default = 5672

mqtt.listeners.tcp.default = 1883
# Region listeners bind one interface each, so a container on region-eu has no
# path to the us listener even though both live in the same broker. Verified:
# rabbitmq-diagnostics listeners reports `mqtt 172.28.1.10 1893`. Spec 2.7, 2.8.
mqtt.listeners.tcp.eu = 172.28.1.10:1893
mqtt.listeners.tcp.us = 172.28.2.10:1993
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic
mqtt.prefetch = 10

definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
definitions.skip_if_unchanged = true

cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit3
cluster_formation.discovery_retry_limit = 3
cluster_formation.discovery_retry_interval = 2000

management.tcp.port = 15672
prometheus.tcp.port = 15692

log.console = true
log.console.level = info
