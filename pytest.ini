[pytest]
testpaths = tests
addopts = -v --strict-markers -m "not experiment and not cluster and not region and not security and not load"
markers =
    stack: test requires the docker compose stack to be running
    experiment: slow reliability experiment; deselected by default, run with -m experiment
    cluster: Phase 3 cluster experiment; needs the compose.cluster.yml overlay and IOT_CLUSTER=1
    region: Phase 4 segregation test; needs the compose.region.yml overlay and IOT_REGION=1
    security: Phase 5 security test; needs the compose.security.yml overlay and IOT_SECURITY=1
    load: Phase 6 load test; needs the compose.load.yml overlay and IOT_LOAD=1
