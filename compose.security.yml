# Phase 5 overlay: mTLS device identity and OAuth2 service identity.
#
# Mounts ONLY targets no other overlay touches — /etc/rabbitmq/conf.d/*,
# /etc/rabbitmq/advanced.config, /etc/rabbitmq/enabled_plugins and /certs —
# so compose.region.yml keeps its documented ALWAYS-LAST position for
# rabbitmq.conf and definitions.json and nothing collides. Adds keycloak
# dependency (service_started, not service_healthy). Position in the -f order
# is therefore free; it goes last so the order reads in phase order.
#
# Requires main/certs/ to exist. Generate it with:
#   .venv/Scripts/python.exe -m scripts.make_certs

services:
  rabbitmq:
    ports:
      - "1883:1883"
      - "8883:8883"
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - ./config/rabbitmq/conf.d/10-security.conf:/etc/rabbitmq/conf.d/10-security.conf:ro
      - ./config/rabbitmq/conf.d/20-oauth2.conf:/etc/rabbitmq/conf.d/20-oauth2.conf:ro
      - ./config/rabbitmq/advanced.config:/etc/rabbitmq/advanced.config:ro
      - ./config/rabbitmq/enabled_plugins.security:/etc/rabbitmq/enabled_plugins:ro
      - ./certs:/certs:ro
    depends_on:
      crl:
        condition: service_healthy
      keycloak:
        # service_started, not service_healthy: Keycloak carries no healthcheck
        # (see Task 10). The broker does not need the issuer reachable to boot;
        # it fetches signing keys when it first validates a token.
        condition: service_started

  crl:
    image: nginx:1.29-alpine
    container_name: iot-crl
    volumes:
      - ./certs:/usr/share/nginx/html:ro
      - ./config/crl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - core
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/root.crl"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # HTTPS is not a choice here: RabbitMQ refuses to boot with a plaintext OIDC
  # issuer -- "According to the JWT Specification, Key Server URL must be https"
  # (spec 2.10). KC_HOSTNAME is pinned so the `iss` claim is stable regardless of
  # which host called the token endpoint; without it the claim reflects the
  # caller and will not match what the broker expects.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: iot-keycloak
    command: ["start-dev", "--http-port=8080", "--https-port=8443", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: "https://keycloak:8443"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTPS_CERTIFICATE_FILE: /certs/keycloak.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /certs/keycloak.key
    volumes:
      - ./certs:/certs:ro
      - ./config/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "18443:8443"
    networks:
      - core
    restart: unless-stopped
